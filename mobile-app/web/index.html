<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>REMI - Tu Coach de Sanación</title>
    <style>
        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            overflow: hidden;
        }

        #splash-loader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #splash-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            animation: pulse 2s infinite ease-in-out;
        }

        .splash-logo svg {
            width: 100%;
            height: 100%;
        }

        .splash-title {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .splash-subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 40px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #a855f7;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>
    <!-- Splash Loader -->
    <div id="splash-loader">
        <div class="splash-logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#a855f7" />
                        <stop offset="100%" style="stop-color:#ec4899" />
                    </linearGradient>
                </defs>
                <path
                    d="M50 88C50 88 15 60 15 38C15 22 28 12 42 12C48 12 50 16 50 16C50 16 52 12 58 12C72 12 85 22 85 38C85 60 50 88 50 88Z"
                    fill="url(#heartGradient)" opacity="0.9" />
                <circle cx="35" cy="35" r="4" fill="white" opacity="0.8" />
                <circle cx="50" cy="45" r="3" fill="white" opacity="0.6" />
                <circle cx="65" cy="35" r="4" fill="white" opacity="0.8" />
                <path d="M35 35 L50 45 L65 35" stroke="white" stroke-width="1.5" opacity="0.4" />
                <path d="M50 45 L50 65" stroke="white" stroke-width="1.5" opacity="0.4" />
            </svg>
        </div>
        <div class="splash-title">REMI</div>
        <div class="splash-subtitle">Tu coach de sanación</div>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <script>
        // Hide splash when app is ready
        window.addEventListener('load', function () {
            setTimeout(function () {
                var splash = document.getElementById('splash-loader');
                if (splash) {
                    splash.classList.add('hidden');
                    setTimeout(function () {
                        splash.remove();
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>

</html>
