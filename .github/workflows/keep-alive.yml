name: Supabase Keep-Alive

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          # Sends a simple GET request to the Supabase REST API to register activity.
          # Using the 'profiles' table which is standard in this project. 
          # We request just 1 record to minimize load.
          
          curl -X GET 'https://mrabsfuwprxisgxfqnuy.supabase.co/rest/v1/profiles?select=id&limit=1' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yYWJzZnV3cHJ4aXNneGZxbnV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzEzOTQsImV4cCI6MjA3OTA0NzM5NH0.V24-RloMtu_yn82Q1DdhtxHoppRwfwe415x7UO1Jjw8' }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yYWJzZnV3cHJ4aXNneGZxbnV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0NzEzOTQsImV4cCI6MjA3OTA0NzM5NH0.V24-RloMtu_yn82Q1DdhtxHoppRwfwe415x7UO1Jjw8' }}" \
          -v
